name: Native public gallery — Picu isolation
on:
  pull_request:
    paths:
      - "inc/public-gallery.php"
      - "functions.php"
      - "assets/js/public-gallery.js"
      - "assets/css/site.css"
      - "tests/public-gallery.test.php"
      - ".github/workflows/native-public-gallery.yml"
  push:
    branches:
      - "feature/native-public-galleries-v1"
    paths:
      - "inc/public-gallery.php"
      - "functions.php"
      - "assets/js/public-gallery.js"
      - "assets/css/site.css"
      - "tests/public-gallery.test.php"
      - ".github/workflows/native-public-gallery.yml"
jobs:
  gallery-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: |
          php -l inc/public-gallery.php
          php -l functions.php
      - name: Native gallery security tests
        run: php tests/public-gallery.test.php
      - name: Browser JavaScript syntax
        run: node --check assets/js/public-gallery.js
