name: V2 CI

on:
  push:
    branches:
      - feat/v2-mobile-first-rebuild
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://aksen-photo.pl
          WORDPRESS_URL: https://aksen-photo.pl
          ALLOW_INDEXING: 'false'
        run: npm run build
